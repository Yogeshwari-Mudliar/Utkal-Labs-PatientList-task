<header class="sticky top-0 z-20 bg-white border-b px-6 py-3 flex items-center justify-between">

  <!-- Left: Search -->
  <div class="flex items-center w-96 relative">
    <i class="pi pi-search absolute left-3 text-gray-400"></i>
    <input
      type="text"
      placeholder="Search..."
      class="w-full pl-9 pr-4 h-9 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"
    />
  </div>

  <!-- Right -->
  <div class="flex items-center gap-4">

    <!-- Notifications -->
    <button class="relative p-2 rounded-lg hover:bg-gray-100">
      <i class="pi pi-bell text-gray-600"></i>

      <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
    </button>

    <!-- Profile -->
    <div class="flex items-center gap-2 cursor-pointer hover:bg-gray-100 px-2 py-1 rounded-lg">
      <img
        src="https://i.pravatar.cc/40"
        class="w-8 h-8 rounded-full"
      />
      <span class="text-sm font-medium">Admin</span>
      <i class="pi pi-angle-down text-xs"></i>
    </div>

  </div>

</header>
