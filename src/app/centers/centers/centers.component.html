<div class="p-4">

  <div class="flex justify-between mb-4">
    <h2 class="text-lg font-semibold">Centers</h2>
    <button pButton label="Add Center" (click)="addCenter()"></button>
  </div>

  <p-table [value]="centers">

    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Location</th>
        <th>Status</th>
        <th style="width:150px">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-center>
      <tr>

        <td>{{ center.name }}</td>
        <td>{{ center.location }}</td>

        <td>
          <span
            class="px-2 py-1 rounded text-xs"
            [ngClass]="center.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-600'">
            {{ center.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>

        <td class="flex gap-2">

          <button pButton icon="pi pi-eye" class="p-button-text"
            (click)="openCenter(center)"></button>

          <button pButton icon="pi pi-pencil" class="p-button-text"
            (click)="editCenter(center)"></button>

          <button pButton icon="pi pi-ban" class="p-button-text"
            (click)="deactivateCenter(center)"></button>

          <button pButton icon="pi pi-trash" class="p-button-text text-red-500"
            (click)="deleteCenter(center)"></button>

        </td>

      </tr>
    </ng-template>

  </p-table>

</div>
