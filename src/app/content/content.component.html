<div class="h-screen bg-gradient-to-b from-indigo-100 via-white to-blue-100 py-4 px-6">

  <!-- Dashboard Card -->
  <div class="h-[87%] flex flex-col backdrop-blur-xl bg-white/60 
              border border-white/40 shadow-2xl rounded-3xl p-6 
              overflow-hidden">

    <!-- Toolbar -->
    <div class="flex flex-col gap-3 mb-4">

      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">

        <!-- Title -->
        <h2 class="text-lg font-semibold text-gray-800 tracking-wide">
          PATIENT LIST
        </h2>

       <!-- Right Controls -->
<div class="flex flex-wrap items-center gap-3">

  <!-- Search -->
  <div class="relative w-56">
    <i class="pi pi-search absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>

    <input
      pInputText
      type="text"
      [(ngModel)]="search"
      (input)="applyFilters()"
      placeholder="     Search..."
      class="w-full pl-8 pr-7 h-[34px] text-sm 
             border border-gray-300 rounded-md
             focus:ring-2 focus:ring-blue-600 
             focus:border-blue-600 outline-none"
    />

    <button
      *ngIf="search"
      type="button"
      (click)="search=''; applyFilters()"
      class="absolute right-1.5 top-1/2 -translate-y-1/2
             w-4 h-4 flex items-center justify-center
             rounded-full hover:bg-gray-100">
      <i class="pi pi-times text-[10px] text-gray-500"></i>
    </button>
  </div>
<p-autoComplete
  [(ngModel)]="selectedDoctor"
  [suggestions]="doctors"
  field="name"

  placeholder="Doctor"
  class="w-40"
  inputStyleClass="!h-[34px] !text-sm"

  [dropdown]="true"
  [virtualScroll]="true"
  [virtualScrollItemSize]="34"
  [scrollHeight]="'200px'"

  (completeMethod)="searchDoctors($event)">
</p-autoComplete>

  <!-- Follow-up Range -->
  <p-calendar
    [(ngModel)]="followUpRange"
    selectionMode="range"
    dateFormat="yy-mm-dd"
    placeholder="Follow-up"
    [showIcon]="true"
    class="w-40"
    styleClass="!h-[34px] !text-sm"
    (onSelect)="applyFilters()">
  </p-calendar>

  <!-- Clear Filters Icon -->
  <button
    type="button"
    (click)="resetFilters()"
    class="w-[34px] h-[34px] flex items-center justify-center
           border border-gray-300 rounded-md
           hover:bg-gray-100 transition"
    pTooltip="Clear all filters"
    tooltipPosition="top">
    <i class="pi pi-filter-slash text-sm text-gray-600"></i>
  </button>

  <!-- Add Patient -->
  <button
    type="button"
    (click)="onAddUser()"
    class="flex items-center gap-1.5 px-3 h-[34px] text-sm
           bg-blue-700 text-white rounded-md
           hover:bg-blue-600 shadow-sm
           transition whitespace-nowrap">
    <i class="pi pi-plus text-sm"></i>
    Add Patient
  </button>

</div>
      </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="flex-1 min-h-0">
<p-table
  #dt
  [value]="userData"

  [lazy]="true"
  (onLazyLoad)="loadLazy($event)"
  [totalRecords]="totalRecords"

  [virtualScroll]="true"
  [virtualScrollItemSize]="60"

  [scrollable]="true"
  scrollHeight="400px"

  [rows]="pageSize"
>
        <!-- HEADER -->
        <ng-template pTemplate="header">
          <tr class="bg-indigo-50">

            <th pSortableColumn="id" class="font-bold px-6 py-4">
              ID
              <p-sortIcon field="id"></p-sortIcon>
            </th>

            <th pSortableColumn="name" class="font-bold px-6 py-4">
              Name
              <p-sortIcon field="name"></p-sortIcon>
            </th>

            <th pSortableColumn="contactNumber" class="font-bold px-6 py-4">
              Contact
              <p-sortIcon field="contactNumber"></p-sortIcon>
            </th>

            <th pSortableColumn="email" class="font-bold px-6 py-4">
              Email
              <p-sortIcon field="email"></p-sortIcon>
            </th>

            <th pSortableColumn="doctorName" class="font-bold px-6 py-4">
              Doctor
              <p-sortIcon field="doctorName"></p-sortIcon>
            </th>

            <th pSortableColumn="illness" class="font-bold px-6 py-4">
              Illness
              <p-sortIcon field="illness"></p-sortIcon>
            </th>

            <th pSortableColumn="nextFollowupDate" class="font-bold px-6 py-4">
              Follow-up
              <p-sortIcon field="nextFollowupDate"></p-sortIcon>
            </th>

          </tr>
        </ng-template>

        <!-- BODY -->
        <ng-template pTemplate="body" let-patient>
          <tr class="hover:bg-indigo-50 transition border-b">

            <td class="px-6 py-4 font-semibold">#{{ patient.id }}</td>
            <td class="px-6 py-4">{{ patient.name }}</td>
            <td class="px-6 py-4">{{ patient.contactNumber }}</td>
            <td class="px-6 py-4">{{ patient.email }}</td>
            <td class="px-6 py-4">{{ patient.doctorName }}</td>
            <td class="px-6 py-4">{{ patient.illness }}</td>
            <td class="px-6 py-4 text-indigo-600 font-semibold">
              {{ patient.nextFollowupDate }}
            </td>

          </tr>
        </ng-template>

      </p-table>
      <p-paginator [rows]="pageSize" [totalRecords]="totalRecords" [first]="currentFirst"
        [rowsPerPageOptions]="[5,10,20]" (onPageChange)="externalPageChange($event)">
      </p-paginator>
    </div>

  </div>
</div>

<!-- Overlay Modal -->
<div *ngIf="showAddPatient" class="fixed inset-0 z-[1000] flex items-center justify-center px-4 py-10">

  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" (click)="handleOverlayClose()">
  </div>
  <div class="relative bg-white rounded-2xl shadow-2xl
           w-full max-w-4xl
           max-h-[90vh] overflow-y-auto
           p-8">

    <div class="flex justify-between items-center mb-6 border-b pb-4">
      <h2 class="text-2xl font-semibold text-gray-800">
        Add Patient
      </h2>

      <button type="button" (click)="showAddPatient = false" class="w-10 h-10 flex items-center justify-center
               rounded-full hover:bg-gray-100 transition">
        <i class="pi pi-times text-gray-600 text-lg"></i>
      </button>
    </div>

    <app-add-patient (close)="handleClose()"></app-add-patient>

  </div>
</div>
